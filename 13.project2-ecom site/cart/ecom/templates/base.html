<!DOCTYPE html>
<html>

<head>

    <title>
        {% block title %}
        My E-Commerce
        {% endblock %}
    </title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
            background-color: #f5f5f5;
        }

        nav {
            background-color: #222;
            padding: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .products {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow:
                0 2px 8px #ccc;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            background: black;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
        }

    </style>

</head>

<body>

    <nav>

        <a href="{% url 'home' %}">
            My Shop
        </a>

        <a href="{% url 'products' %}">
            Products
        </a>

        <a href="/admin/">
            Admin
        </a>

    </nav>


    <div class="container">

        {% block content %}

        {% endblock %}

    </div>


</body>

</html>
